<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — lococlic</title>
<script>
(function(){
  try {
    var s = localStorage.getItem('lococlic_session');
    if (!s) { window.location.href = 'login.html'; return; }
    var d = JSON.parse(s);
    if (!d.expires || Date.now() >= d.expires) {
      localStorage.removeItem('lococlic_session');
      window.location.href = 'login.html';
      return;
    }
  } catch(e) { window.location.href = 'login.html'; }
})();
</script>
<script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('lococlic_session'));
    if (s && s.jetonSession) {
      fetch('https://lococlic-worker.simon-albiach.workers.dev/verifier-session?limite=1', {
        headers: { 'Authorization': 'Bearer ' + s.jetonSession }
      }).then(function(r){ return r.json(); }).then(function(d){
        if (!d.valide) {
          localStorage.removeItem('lococlic_session');
          window.location.href = 'login.html';
        }
      }).catch(function(){});
    }
  } catch(e) {}
})();
</script>
<style>
  :root {
    --navy: #1e3a5f;
    --accent2: #2c5f8d;
    --bg: #f5f3ee;
    --green: #16a34a;
    --red: #dc2626;
    --border: #e2e8f0;
    --text-muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
  }

  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    color: var(--navy);
    text-decoration: none;
  }
  .topbar-brand img { width: 32px; height: 32px; border-radius: 8px; }
  .topbar-brand sup { font-size: 10px; }

  .profil {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    padding: 6px 14px 6px 6px;
    border-radius: 30px;
  }
  .profil-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--navy) 0%, var(--accent2) 100%);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 16px;
  }
  .profil-email { font-size: 13px; color: var(--text-muted); }

  @media (max-width: 480px) {
    .profil-email { display: none; }
  }

  .conteneur { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }

  h1 { font-size: 24px; margin-bottom: 6px; }
  .sous-titre { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }

  .onglets {
    display: flex; gap: 4px; background: #ffffff; padding: 4px;
    border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px;
  }
  .onglet {
    flex: 1; text-align: center; padding: 10px 12px; border-radius: 9px;
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; border: none; background: transparent; transition: all 0.15s;
  }
  .onglet.actif { background: var(--navy); color: white; }

  .carte { background: #ffffff; border-radius: 16px; border: 1px solid var(--border); padding: 28px; }

  .panneau { display: none; }
  .panneau.actif { display: block; }

  .ligne-info {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--border); gap: 12px;
  }
  .ligne-info:last-of-type { border-bottom: none; }
  .ligne-info-label { font-size: 13px; color: var(--text-muted); }
  .ligne-info-valeur { font-size: 14px; font-weight: 600; color: var(--navy); text-align: right; }
  .ligne-info-valeur a { color: var(--navy); }

  .badge-actif {
    display: inline-flex; align-items: center; gap: 6px;
    background: #f0fdf4; color: var(--green);
    font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
  }
  .badge-actif::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  .zone-info-annulation {
    background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
    padding: 14px 16px; margin-top: 16px; font-size: 13px; color: #92400e; line-height: 1.5;
  }

  .zone-modifier {
    margin-top: 24px; padding: 20px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px;
  }
  .zone-modifier-titre { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .zone-modifier-texte { font-size: 13px; color: #475569; line-height: 1.5; margin-bottom: 14px; }
  .btn-modifier {
    background: var(--navy); color: white; border: none;
    font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 10px;
    cursor: pointer; width: 100%;
  }
  .btn-modifier:hover { background: var(--accent2); }
  .btn-modifier:disabled { opacity: 0.6; cursor: not-allowed; }

  .zone-danger { margin-top: 20px; padding-top: 24px; border-top: 1px solid var(--border); }
  .zone-danger-titre { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; }
  .btn-resilier {
    background: #ffffff; border: 1.5px solid #fecaca; color: var(--red);
    font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 10px;
    cursor: pointer; width: 100%;
  }
  .btn-resilier:hover { background: #fef2f2; }
  .btn-resilier:disabled { opacity: 0.6; cursor: not-allowed; }

  .confirmation { display: none; margin-top: 16px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 16px; }
  .confirmation.actif { display: block; }
  .confirmation p { font-size: 13px; color: #7f1d1d; margin-bottom: 12px; line-height: 1.5; }
  .confirmation-boutons { display: flex; gap: 10px; }
  .btn-confirmer-resiliation { background: var(--red); color: white; border: none; font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; flex: 1; }
  .btn-annuler-resiliation { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; flex: 1; }

  .message-info { font-size: 14px; color: var(--text-muted); text-align: center; padding: 20px 0; }
</style>

      Déconnexion
    </button>

<div class="conteneur">
  <h1>Mon espace</h1>
  <p class="sous-titre">Gérez votre compte et votre abonnement LocoClic</p>

  <div class="onglets">
    <button class="onglet actif" onclick="changerOnglet('abonnement', event)">Mon abonnement</button>
    <button class="onglet" onclick="changerOnglet('factures', event)">Mes factures</button>
    <button class="onglet" onclick="changerOnglet('compte', event)">Mes informations</button>
  </div>

  <div class="bandeau-paiement" id="bandeau-paiement"></div>

  <div class="carte">

    <div class="panneau actif" id="panneau-abonnement">
      <div id="details-abonnement">
        <p class="message-info">Chargement...</p>
      </div>
    </div>

    <div class="panneau" id="panneau-factures">
      <div id="liste-factures">
        <p class="message-info">Chargement...</p>
      </div>
    </div>

    <div class="panneau" id="panneau-compte">
      <div class="ligne-info">
        <span class="ligne-info-label">Email</span>
        <span class="ligne-info-valeur" id="info-email">···</span>
      </div>
    </div>

  </div>
</div>

<script>
const WORKER_URL = 'https://lococlic-worker.simon-albiach.workers.dev';

function getSession() {
  try { return JSON.parse(localStorage.getItem('lococlic_session')); }
  catch(e) { return null; }
}
const session = getSession();

document.getElementById('email-affiche').textContent = session.email;
document.getElementById('info-email').textContent = session.email;

async function seDeconnecter() {
  try {
    if (session && session.jetonSession) {
      await fetch(WORKER_URL + '/deconnexion', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.jetonSession }
      });
    }
  } catch(e) {}
  try { await fetch('/api/session', { method: 'DELETE', credentials: 'same-origin' }); } catch(e) {}
  localStorage.removeItem('lococlic_session');
  window.location.href = 'login.html';
}

function changerOnglet(nom, evt) {
  document.querySelectorAll('.onglet').forEach(o => o.classList.remove('actif'));
  document.querySelectorAll('.panneau').forEach(p => p.classList.remove('actif'));
  evt.target.classList.add('actif');
  document.getElementById('panneau-' + nom).classList.add('actif');
}

function formaterDate(iso) {
  return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

function echapperHtml(texte) {
  return String(texte).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function afficherAbonnement(abonnement) {
  const conteneur = document.getElementById('details-abonnement');
  if (!abonnement) {
    conteneur.innerHTML = '<p class="message-info">Aucun abonnement actif.</p>';
    return;
  }

  if (abonnement.type === 'interne') {
    conteneur.innerHTML = `
      <div class="ligne-info">
        <span class="ligne-info-label">Statut</span>
        <span class="badge-actif">Actif</span>
      </div>
      <div class="ligne-info">
        <span class="ligne-info-label">Formule</span>
        <span class="ligne-info-valeur">Interne — Gratuit</span>
      </div>
      <div class="ligne-info">
        <span class="ligne-info-label">Fin de la gratuité</span>
        <span class="ligne-info-valeur">${formaterDate(abonnement.fin_gratuite)}</span>
      </div>
    `;
    return;
  }

  if (abonnement.type === 'termine') {
    const nomStructure = abonnement.structure_nom ? ' — ' + echapperHtml(abonnement.structure_nom) : '';
    const lignesTermine = `
      <div class="ligne-info">
        <span class="ligne-info-label">Statut</span>
        <span class="badge-termine">Terminé</span>
      </div>
      <div class="ligne-info">
        <span class="ligne-info-label">Formule</span>
        <span class="ligne-info-valeur">${abonnement.profil === 'individuel' ? 'Médecin' : 'Licence collective' + nomStructure}</span>
      </div>
    `;
    const aidePaiement = `<div class="aide-reprise">Paiement sécurisé par Stripe · accès rétabli dès la validation du paiement.</div>`;
    if (abonnement.profil === 'gestionnaire') {
      const nb = abonnement.nombre_comptes;
      const prixUnitaire = nb && nb <= 4 ? 159 : 149;
      conteneur.innerHTML = lignesTermine + `
        <div class="zone-reprise">
          <div class="zone-reprise-titre">Renouveler la licence</div>
          <div class="zone-reprise-texte">La licence de votre structure est terminée. Dès le paiement, ${nb ? 'les ' + nb + ' professionnels' : 'les professionnels'} retrouvent l'accès avec le même code.</div>
          ${nb ? `<div class="recap-licence"><span>${nb} professionnels × ${prixUnitaire} €</span><strong>${nb * prixUnitaire} € / an</strong></div>` : ''}
          <button class="btn-principal" id="btn-renouveler" onclick="renouvelerLicence()">Renouveler la licence</button>
          ${aidePaiement}
          <span class="lien-secondaire" onclick="afficherReaboIndividuel()">Ou souscrire un abonnement individuel</span>
          <div class="bloc-reabo-indiv" id="bloc-reabo-indiv">
            ${htmlPlansReabo()}
            <button class="btn-principal" id="btn-reabonner-indiv" onclick="reabonnerIndividuel()">Me réabonner</button>
          </div>
        </div>
      `;
    } else if (abonnement.profil === 'membre') {
      conteneur.innerHTML = lignesTermine + `
        <div class="zone-reprise">
          <div class="zone-reprise-titre">La licence de votre structure est terminée</div>
          <div class="zone-reprise-texte">Contactez la personne qui gère la licence dans votre structure pour la renouveler, ou abonnez-vous individuellement :</div>
          ${htmlPlansReabo()}
          <button class="btn-principal" id="btn-reabonner" onclick="reabonner()">Me réabonner</button>
          ${aidePaiement}
        </div>
      `;
    } else {
      conteneur.innerHTML = lignesTermine + `
        <div class="zone-reprise">
          <div class="zone-reprise-titre">Retrouvez votre accès</div>
          <div class="zone-reprise-texte">Votre abonnement est terminé. Réabonnez-vous pour retrouver toutes les fiches : votre compte et vos données sont conservés.</div>
          ${htmlPlansReabo()}
          <button class="btn-principal" id="btn-reabonner" onclick="reabonner()">Me réabonner</button>
          ${aidePaiement}
          <div class="aide-reprise">Le mois d'essai gratuit n'est proposé qu'à la première inscription.</div>
        </div>
      `;
    }
    return;
  }

  if (abonnement.type === 'msp') {
    const dateLicence = abonnement.prochain_prelevement ? formaterDate(abonnement.prochain_prelevement) : null;
    const lignesAcces = `
      <div class="ligne-info">
        <span class="ligne-info-label">Statut</span>
        <span class="badge-actif">Actif</span>
      </div>
      <div class="ligne-info">
        <span class="ligne-info-label">Formule</span>
        <span class="ligne-info-valeur">Licence collective${abonnement.structure_nom ? ' — ' + echapperHtml(abonnement.structure_nom) : ''}</span>
      </div>
      <p class="message-info">Accès pris en charge par votre structure. Si la licence prend fin, vous pourrez souscrire un abonnement individuel.</p>
    `;
    if (!abonnement.gestionnaire) {
      conteneur.innerHTML = lignesAcces + htmlQuitterLicence(false);
      return;
    }

    const nb = abonnement.nombre_comptes;
    const textePros = nb ? 'les ' + nb + ' professionnels' : 'tous les professionnels';
    const lignesLicence = `
      <div class="ligne-info">
        <span class="ligne-info-label">Statut</span>
        <span class="badge-actif">Actif</span>
      </div>
      ${nb ? `<div class="ligne-info"><span class="ligne-info-label">Places utilisées</span><span class="ligne-info-valeur">${abonnement.places_utilisees != null ? abonnement.places_utilisees : '—'} sur ${nb}</span></div>` : ''}
      ${dateLicence ? `<div class="ligne-info"><span class="ligne-info-label">${abonnement.annulation_prevue ? 'Fin de la licence' : 'Renouvellement'}</span><span class="ligne-info-valeur">${dateLicence}</span></div>` : ''}
    `;
    let actionsLicence;
    if (abonnement.annulation_prevue) {
      actionsLicence = `<div class="zone-info-annulation">⚠️ Résiliation programmée : la licence prendra fin le <strong>${dateLicence || 'à la fin de la période en cours'}</strong> pour ${textePros} de la structure.</div>` + `<div class="zone-reprise"><div class="zone-reprise-titre">Vous changez d'avis ?</div><div class="zone-reprise-texte">La licence continue normalement pour tous les professionnels de la structure : aucun paiement à faire.</div><button class="btn-principal" id="btn-reprendre" onclick="reprendreAbonnement()">Reprendre la licence</button></div>`;
    } else {
      actionsLicence = `
        <button class="btn-collectif" id="btn-resilier-collectif" onclick="demanderResiliationCollective()">Résilier la licence de toute la structure</button>
        <div id="confirmation-collective" style="display:none;">
          <div class="g-confirm">
            <div class="g-confirm-titre">Résilier la licence pour ${textePros} ?</div>
            <ul>
              <li>La licence reste active jusqu'au <strong>${dateLicence || 'la fin de la période déjà payée'}</strong>, puis n'est pas renouvelée.</li>
              <li>À cette date, <strong>${textePros}</strong> perdent l'accès en même temps que vous.</li>
              <li>Chacun pourra ensuite s'abonner individuellement.</li>
            </ul>
            <button class="btn-principal" onclick="annulerResiliationCollective()">Garder la licence</button>
            <button class="btn-resilier" id="btn-confirmer" onclick="confirmerResiliation()" disabled style="margin-top:10px;">Confirmer la résiliation pour tous</button>
          </div>
        </div>
      `;
    }
    const point = abonnement.annulation_prevue ? ' <b class="g-point"></b>' : '';
    conteneur.innerHTML = `
      <div class="g-onglets">
        <button class="g-onglet" id="onglet-acces" onclick="changerOngletGestion('acces')">👤 Mon accès</button>
        <button class="g-onglet" id="onglet-licence" onclick="changerOngletGestion('licence')">👥 Licence de la structure${point}<em>gestionnaire</em></button>
      </div>
      <div id="vue-acces">${lignesAcces}${htmlQuitterLicence(true)}</div>
      <div id="vue-licence" style="display:none;">
        <div class="g-bande">Vous agissez pour <strong>toute la structure</strong>${nb ? ' (' + nb + ' professionnels)' : ''}.</div>
        ${lignesLicence}
        ${actionsLicence}
      </div>
    `;
    changerOngletGestion(ongletGestion);
    return;
  }

  const libellePlan = abonnement.plan === 'annuel' ? 'Médecin — Annuel' : 'Médecin — Mensuel';
  const unite = abonnement.plan === 'annuel' ? '/ an' : '/ mois';
  const autrePlan = abonnement.plan === 'annuel' ? 'mensuel' : 'annuel';
  const texteBouton = abonnement.plan === 'annuel' ? 'Passer au mensuel' : 'Passer à l\'annuel';
  const texteExplicatif = abonnement.plan === 'annuel'
    ? 'Passez au mensuel pour plus de flexibilité (14,90 €/mois).'
    : 'Passez à l\'annuel pour économiser (159 € au lieu de 178,80 € sur l\'année).';

  let html = `
    <div class="ligne-info">
      <span class="ligne-info-label">Statut</span>
      <span class="badge-actif">Actif</span>
    </div>
    <div class="ligne-info">
      <span class="ligne-info-label">Formule</span>
      <span class="ligne-info-valeur">${libellePlan}</span>
    </div>
    <div class="ligne-info">
      <span class="ligne-info-label">Montant</span>
      <span class="ligne-info-valeur">${abonnement.montant} € ${unite}</span>
    </div>
    <div class="ligne-info">
      <span class="ligne-info-label">Prochain prélèvement</span>
      <span class="ligne-info-valeur">${formaterDate(abonnement.prochain_prelevement)}</span>
    </div>
  `;

  if (abonnement.annulation_prevue) {
    html += `<div class="zone-info-annulation">⚠️ Résiliation programmée : votre abonnement prendra fin le ${formaterDate(abonnement.prochain_prelevement)} et ne sera pas renouvelé.</div>` + `<div class="zone-reprise"><div class="zone-reprise-titre">Vous changez d'avis ?</div><div class="zone-reprise-texte">Votre abonnement continue normalement : aucun paiement à faire, aucune démarche de plus.</div><button class="btn-principal" id="btn-reprendre" onclick="reprendreAbonnement()">Reprendre mon abonnement</button></div>`;
  } else {
    html += `
      <div class="zone-modifier">
        <div class="zone-modifier-titre">Modifier mon abonnement</div>
        <div class="zone-modifier-texte">${texteExplicatif}</div>
        <button class="btn-modifier" id="btn-modifier" onclick="changerPlan()">${texteBouton}</button>
      </div>
      <div class="zone-danger">
        <div class="zone-danger-titre">Résiliation</div>
        <button class="btn-resilier" id="btn-resilier" onclick="document.getElementById('confirmation').classList.add('actif')">
          Résilier mon abonnement
        </button>
        <div class="confirmation" id="confirmation">
          <p>Votre abonnement restera actif jusqu'à la fin de la période déjà payée, puis ne sera pas renouvelé.</p>
          <div class="confirmation-boutons">
            <button class="btn-annuler-resiliation" onclick="document.getElementById('confirmation').classList.remove('actif')">Garder mon abonnement</button>
            <button class="btn-confirmer-resiliation" id="btn-confirmer" onclick="confirmerResiliation()">Confirmer la résiliation</button>
          </div>
        </div>
      </div>
    `;
  }

  conteneur.innerHTML = html;
}

function formaterLibelleFacture(dateIso, plan) {
  const date = new Date(dateIso);
  if (plan === 'annuel') {
    return `Facture ${date.getFullYear()}`;
  }
  const mois = date.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return `Facture de ${mois}`;
}

async function chargerFactures() {
  const conteneurFactures = document.getElementById('liste-factures');
  try {
    const reponse = await fetch(WORKER_URL + '/mes-factures', {
      headers: { 'Authorization': 'Bearer ' + session.jetonSession }
    });
    if (reponse.status === 401) {
      localStorage.removeItem('lococlic_session');
      window.location.href = 'login.html';
      return;
    }
    const data = await reponse.json();

    afficherAbonnement(data.abonnement);

    if (!data.factures || data.factures.length === 0) {
      conteneurFactures.innerHTML = '<p class="message-info">Aucune facture pour le moment.</p>';
      return;
    }
    const planPourLibelle = data.abonnement && data.abonnement.type === 'medecin' ? data.abonnement.plan : null;
    conteneurFactures.innerHTML = data.factures.map(f => {
      const libelle = formaterLibelleFacture(f.date, planPourLibelle);
      // Le lien n'est affiché que si c'est une adresse https:// propre (sans guillemets ni caractères spéciaux)
      const lienPdf = (typeof f.pdf === 'string' && /^https:\/\/[^\s"'<>`]+$/.test(f.pdf)) ? f.pdf : '';
      return `<div class="ligne-info">
        <span class="ligne-info-label">${libelle}</span>
        <span class="ligne-info-valeur">${f.montant} €${lienPdf ? ' — <a href="' + lienPdf + '" target="_blank" rel="noopener">Télécharger PDF</a>' : ''}</span>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('details-abonnement').innerHTML = '<p class="message-info" style="color:#dc2626;">Erreur de chargement.</p>';
    conteneurFactures.innerHTML = '<p class="message-info" style="color:#dc2626;">Erreur de chargement.</p>';
  }
}

async function changerPlan() {
  const btn = document.getElementById('btn-modifier');
  btn.disabled = true;
  btn.textContent = 'Traitement...';
  try {
    const reponse = await fetch(WORKER_URL + '/changer-plan', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + session.jetonSession }
    });
    if (reponse.status === 401) {
      localStorage.removeItem('lococlic_session');
      window.location.href = 'login.html';
      return;
    }
    const data = await reponse.json();
    if (data.success) {
      chargerFactures();
    } else {
      alert(data.error || 'Erreur lors du changement de formule.');
      btn.disabled = false;
      btn.textContent = 'Réessayer';
    }
  } catch(e) {
    alert('Erreur de connexion. Réessayez.');
    btn.disabled = false;
  }
}

async function confirmerResiliation() {
  const btnConfirmer = document.getElementById('btn-confirmer');
  const libelleConfirmer = btnConfirmer.textContent;
  btnConfirmer.disabled = true;
  btnConfirmer.textContent = 'Traitement...';
  try {
    const reponse = await fetch(WORKER_URL + '/resilier-abonnement', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + session.jetonSession }
    });
    if (reponse.status === 401) {
      localStorage.removeItem('lococlic_session');
      window.location.href = 'login.html';
      return;
    }
    const data = await reponse.json();
    if (data.success) {
      chargerFactures();
    } else {
      alert(data.error || 'Erreur lors de la résiliation.');
      btnConfirmer.disabled = false;
      btnConfirmer.textContent = libelleConfirmer;
    }
  } catch(e) {
    alert('Erreur de connexion. Réessayez.');
    btnConfirmer.disabled = false;
    btnConfirmer.textContent = libelleConfirmer;
  }
}

let planReabo = 'annuel';

function htmlPlansReabo() {
  return `<div class="plans-reabo">
    <div class="plan-reabo" id="plan-reabo-mensuel" onclick="choisirPlanReabo('mensuel')"><div class="nom">Mensuel</div><div class="prix">14,90 €</div><div class="unite">/ mois</div></div>
    <div class="plan-reabo selectionne" id="plan-reabo-annuel" onclick="choisirPlanReabo('annuel')"><div class="nom">Annuel</div><div class="prix">159 €</div><div class="unite">/ an</div><div class="eco">Économisez 19,80 €</div></div>
  </div>`;
}

function choisirPlanReabo(plan) {
  planReabo = plan;
  document.querySelectorAll('.plan-reabo').forEach(function (c) { c.classList.remove('selectionne'); });
  const carte = document.getElementById('plan-reabo-' + plan);
  if (carte) carte.classList.add('selectionne');
}

function afficherReaboIndividuel() {
  const bloc = document.getElementById('bloc-reabo-indiv');
  if (bloc) bloc.classList.toggle('actif');
}

async function appelerWorker(chemin, corps) {
  const reponse = await fetch(WORKER_URL + chemin, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + session.jetonSession, 'Content-Type': 'application/json' },
    body: corps ? JSON.stringify(corps) : undefined
  });
  if (reponse.status === 401) {
    localStorage.removeItem('lococlic_session');
    window.location.href = 'login.html';
    return null;
  }
  return await reponse.json();
}

async function lancerPaiement(chemin, corps, idBouton, libelle) {
  const btn = document.getElementById(idBouton);
  if (btn) { btn.disabled = true; btn.textContent = 'Redirection vers le paiement...'; }
  try {
    const data = await appelerWorker(chemin, corps);
    if (data === null) return;
    if (data.url) { window.location.href = data.url; return; }
    alert(data.error || 'Une erreur est survenue.');
  } catch (e) {
    alert('Erreur de connexion. Réessayez.');
  }
  if (btn) { btn.disabled = false; btn.textContent = libelle; }
}

function reabonner() { return lancerPaiement('/reabonner', { plan: planReabo }, 'btn-reabonner', 'Me réabonner'); }
function reabonnerIndividuel() { return lancerPaiement('/reabonner', { plan: planReabo }, 'btn-reabonner-indiv', 'Me réabonner'); }
function renouvelerLicence() { return lancerPaiement('/renouveler-licence', null, 'btn-renouveler', 'Renouveler la licence'); }

async function reprendreAbonnement() {
  const btn = document.getElementById('btn-reprendre');
  const libelle = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Traitement...'; }
  try {
    const data = await appelerWorker('/reprendre-abonnement', null);
    if (data === null) return;
    if (data.success) { chargerFactures(); return; }
    alert(data.error || 'Une erreur est survenue.');
  } catch (e) {
    alert('Erreur de connexion. Réessayez.');
  }
  if (btn) { btn.disabled = false; btn.textContent = libelle; }
}

function gererRetourPaiement() {
  const retour = new URLSearchParams(window.location.search).get('paiement');
  const bandeau = document.getElementById('bandeau-paiement');
  if (!bandeau) return;
  if (retour === 'annule') {
    bandeau.className = 'bandeau-paiement info';
    bandeau.textContent = "Paiement annulé : rien n'a été débité. Vous pouvez réessayer quand vous voulez.";
    return;
  }
  if (retour !== 'succes') return;
  bandeau.className = 'bandeau-paiement ok';
  const attendIndividuel = new URLSearchParams(window.location.search).get('changement') === 'individuel';
  bandeau.textContent = attendIndividuel ? "Paiement reçu — passage à votre abonnement individuel en cours…" : "Paiement reçu — activation de votre accès en cours…";
  let essais = 0;
  const boucle = async function () {
    essais++;
    try {
      const reponse = await fetch(WORKER_URL + '/mes-factures', { headers: { 'Authorization': 'Bearer ' + session.jetonSession } });
      const data = await reponse.json();
      if (data.abonnement && (attendIndividuel ? data.abonnement.type === 'medecin' : data.abonnement.type !== 'termine')) {
        const s = getSession();
        if (s) { s.statut = 'medecin_actif'; delete s.profil; localStorage.setItem('lococlic_session', JSON.stringify(s)); }
        window.location.href = 'index.html';
        return;
      }
    } catch (e) {}
    if (essais < 15) setTimeout(boucle, 2000);
    else bandeau.textContent = "Votre paiement est en cours de traitement. Rechargez cette page dans quelques instants : votre accès sera rétabli dès sa validation.";
  };
  boucle();
}

function htmlQuitterLicence(estGestionnaire) {
  const note = estGestionnaire ? `<div class="note-gestion">Vous avez activé cette licence en premier : en partant, sa gestion (résiliation, renouvellement) passera automatiquement à un autre membre de la structure.</div>` : '';
  return `
    <span class="lien-quitter" id="lien-quitter" onclick="ouvrirQuitter()">Quitter la structure (pour moi seulement)</span>
    <div class="zone-quitter" id="zone-quitter">
      <div id="quitter-options">
        <div class="zone-quitter-titre">Quitter la structure</div>
        <div class="zone-quitter-texte">Cela ne concerne que vous : votre place sera libérée pour un collègue. Choisissez comment continuer :</div>
        ${note}
        <div class="option-quitter principale">
          <div class="option-quitter-titre">Passer à un abonnement individuel</div>
          <div class="option-quitter-texte">Votre accès continue sans interruption. Dès le paiement, vous quittez la structure.</div>
          ${htmlPlansReabo()}
          <button class="btn-principal" id="btn-passer-individuel" onclick="passerEnIndividuel()">Continuer vers le paiement</button>
          <div class="aide-reprise">Sans mois d'essai gratuit · paiement sécurisé par Stripe.</div>
        </div>
        <div class="option-quitter">
          <div class="option-quitter-titre">Quitter sans abonnement</div>
          <div class="option-quitter-texte">Votre accès s'arrête immédiatement. Votre compte est conservé : vous pourrez vous réabonner à tout moment.</div>
          <button class="btn-resilier" onclick="demanderConfirmationDepart()">Quitter la structure</button>
        </div>
      </div>
      <div id="quitter-confirmation" style="display:none;">
        <div class="confirmation-depart">
          <div class="confirmation-depart-titre">Confirmer votre départ ?</div>
          <p>Votre accès s'arrêtera maintenant et votre place sera libérée pour un collègue. Votre compte et vos données sont conservés : vous pourrez vous réabonner quand vous voulez.</p>
          <button class="btn-principal" onclick="annulerDepart()">Rester dans la structure</button>
          <button class="btn-resilier" id="btn-confirmer-depart" onclick="confirmerDepart()" disabled>Confirmer mon départ</button>
        </div>
      </div>
    </div>
  `;
}

let minuterieDepart = null;

function ouvrirQuitter() {
  document.getElementById('lien-quitter').style.display = 'none';
  document.getElementById('zone-quitter').classList.add('actif');
}

function demanderConfirmationDepart() {
  document.getElementById('quitter-options').style.display = 'none';
  document.getElementById('quitter-confirmation').style.display = 'block';
  const btn = document.getElementById('btn-confirmer-depart');
  btn.disabled = true;
  clearTimeout(minuterieDepart);
  minuterieDepart = setTimeout(function () { btn.disabled = false; }, 2000);
}

function annulerDepart() {
  clearTimeout(minuterieDepart);
  document.getElementById('quitter-confirmation').style.display = 'none';
  document.getElementById('quitter-options').style.display = 'block';
}

async function confirmerDepart() {
  const btn = document.getElementById('btn-confirmer-depart');
  btn.disabled = true;
  btn.textContent = 'Traitement...';
  try {
    const data = await appelerWorker('/quitter-licence', null);
    if (data === null) return;
    if (data.success) {
      const s = getSession();
      if (s) { s.statut = 'medecin_resilie'; s.profil = 'individuel'; localStorage.setItem('lococlic_session', JSON.stringify(s)); }
      chargerFactures();
      return;
    }
    alert(data.error || 'Une erreur est survenue.');
  } catch (e) {
    alert('Erreur de connexion. Réessayez.');
  }
  btn.disabled = false;
  btn.textContent = 'Confirmer mon départ';
}

function passerEnIndividuel() { return lancerPaiement('/reabonner', { plan: planReabo }, 'btn-passer-individuel', 'Continuer vers le paiement'); }

let ongletGestion = 'acces';
let minuterieCollective = null;

function changerOngletGestion(nom) {
  ongletGestion = nom;
  const vueAcces = document.getElementById('vue-acces');
  const vueLicence = document.getElementById('vue-licence');
  const ongletAcces = document.getElementById('onglet-acces');
  const ongletLicence = document.getElementById('onglet-licence');
  if (!vueAcces || !vueLicence || !ongletAcces || !ongletLicence) return;
  vueAcces.style.display = nom === 'acces' ? 'block' : 'none';
  vueLicence.style.display = nom === 'licence' ? 'block' : 'none';
  if (nom === 'acces') { ongletAcces.classList.add('actif'); ongletLicence.classList.remove('actif'); }
  else { ongletLicence.classList.add('actif'); ongletAcces.classList.remove('actif'); }
}

function demanderResiliationCollective() {
  document.getElementById('btn-resilier-collectif').style.display = 'none';
  document.getElementById('confirmation-collective').style.display = 'block';
  const btn = document.getElementById('btn-confirmer');
  btn.disabled = true;
  clearTimeout(minuterieCollective);
  minuterieCollective = setTimeout(function () { btn.disabled = false; }, 2000);
}

function annulerResiliationCollective() {
  clearTimeout(minuterieCollective);
  document.getElementById('confirmation-collective').style.display = 'none';
  document.getElementById('btn-resilier-collectif').style.display = 'block';
}

chargerFactures();
gererRetourPaiement();
</script>

</body>
</html>
