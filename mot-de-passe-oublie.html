<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — lococlic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f3ee;
    color: #1e293b;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .conteneur { width: 100%; max-width: 420px; }
  .carte {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(15,42,68,0.08);
  }
  .entete {
    background: linear-gradient(135deg, #1e3a5f 0%, #2c5f8d 100%);
    padding: 32px 32px 24px;
    text-align: center;
  }
  .entete img { width: 56px; height: 56px; border-radius: 12px; margin-bottom: 12px; }
  .entete h1 { color: white; font-size: 20px; font-weight: 700; }
  .corps { padding: 28px 32px 32px; }
  .sous-titre { font-size: 13px; color: #64748b; line-height: 1.5; margin-bottom: 22px; }
  .champ { margin-bottom: 18px; }
  .champ label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
  .champ input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
  }
  .champ input:focus { outline: none; border-color: #1e3a5f; }
  .btn-soumettre {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1e3a5f 0%, #2c5f8d 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-soumettre:disabled { opacity: 0.6; cursor: not-allowed; }
  .message {
    display: none;
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
  }
  .message.succes { display: block; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .message.erreur { display: block; background: #fef2f2; color: #7f1d1d; border: 1px solid #fecaca; }
  .lien-connexion { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
  .lien-connexion a { color: #1e3a5f; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>

<div class="conteneur">
  <div class="carte">
    <div class="entete">
      <img src="images/logo.png" alt="LocoClic">
      <h1>Mot de passe oublié</h1>
    </div>
    <div class="corps">
      <p class="sous-titre">Entrez votre email, vous recevrez un lien pour choisir un nouveau mot de passe.</p>
      <form id="form-oubli" onsubmit="soumettre(event)">
        <div class="champ">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <button type="submit" class="btn-soumettre" id="btn">Envoyer le lien</button>
        <div class="message" id="message"></div>
      </form>
      <div class="lien-connexion">
        <a href="login.html">← Retour à la connexion</a>
      </div>
    </div>
  </div>
</div>

<script>
const WORKER_URL = 'https://lococlic-worker.simon-albiach.workers.dev';

async function soumettre(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';

  try {
    const reponse = await fetch(WORKER_URL + '/mot-de-passe-oublie', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value })
    });
    const data = await reponse.json();
    const msg = document.getElementById('message');
    msg.className = 'message succes';
    msg.textContent = data.message || 'Si un compte existe avec cette adresse, un email de réinitialisation a été envoyé.';
    document.getElementById('form-oubli').querySelector('input').value = '';
  } catch (err) {
    const msg = document.getElementById('message');
    msg.className = 'message erreur';
    msg.textContent = 'Erreur de connexion. Réessayez.';
  }
  btn.disabled = false;
  btn.textContent = 'Envoyer le lien';
}
</script>

</body>
</html>
